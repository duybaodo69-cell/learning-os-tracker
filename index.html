<!doctype html>
<!-- lang="vi": báo cho trình duyệt biết nội dung là tiếng Việt. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />

    <!-- iPhone dùng riêng thẻ này khi bạn bấm "Thêm vào MH chính". -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      viewport: bắt buộc cho mobile-first.
      - width=device-width: rộng đúng bằng màn hình điện thoại
      - viewport-fit=cover: dùng cả phần màn hình quanh "tai thỏ"
      - maximum-scale=1: tránh iOS tự phóng to khi bấm vào ô nhập
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />

    <!-- Màu thanh trạng thái khi cài app lên điện thoại (dark teal). -->
    <meta name="theme-color" content="#0D6570" />

    <!-- Để iOS mở app dạng toàn màn hình khi cài vào màn hình chính. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LearnOS" />

    <title>Learning OS Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
