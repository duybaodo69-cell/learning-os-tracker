<!doctype html>
<!-- lang="vi": báo cho trình duyệt biết nội dung là tiếng Việt. -->
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />

    <!-- iPhone dùng riêng thẻ này khi bạn bấm "Thêm vào MH chính". -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
      viewport: bắt buộc cho mobile-first.
      - width=device-width: rộng đúng bằng màn hình điện thoại
      - viewport-fit=cover: dùng cả phần màn hình quanh "tai thỏ"

      CỐ Ý KHÔNG có maximum-scale=1 / user-scalable=no.
      Hai thứ đó chặn luôn cả thao tác chụm ngón tay phóng to của người dùng —
      ai mắt kém hoặc cần đọc kỹ một con số nhỏ sẽ không phóng được.
      Việc iOS tự phóng to khi chạm vào ô nhập được xử lý ở src/index.css
      bằng cách đặt sàn cỡ chữ 16px cho input/select/textarea.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Màu thanh trạng thái khi cài app: trùng màu nền app (#0c0e12). -->
    <meta name="theme-color" content="#0c0e12" />

    <!-- Để iOS mở app dạng toàn màn hình khi cài vào màn hình chính. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LearnOS" />

    <title>Learning OS Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
